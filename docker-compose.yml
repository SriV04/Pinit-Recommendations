services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pinit-recommendations-api
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    env_file:
      - .env
    # volumes:
      # Mount source code for development (comment out for production)
      # - ./src:/app/src
      # - ./data:/app/data
      # - ./output:/app/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# For production deployment without volume mounts:
# Uncomment the section below and comment out the volumes above
  api-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pinit-recommendations-api-prod
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
